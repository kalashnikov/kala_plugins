<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
  --bg: #f6f4ee; --panel: #fffdf8; --ink: #1d232b; --muted: #5d6670; --line: #d9d4c7;
  --accent: #1f5fa8; --accent-soft: #e3ecf7;
  --ok: #1e7a46; --ok-soft: #e1f2e7; --warn: #a15c00; --warn-soft: #fbeed8;
  --err: #b42318; --err-soft: #fbe4e1; --info: #1f5fa8; --info-soft: #e3ecf7;
  --code-bg: #efece3;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161b; --panel: #1a2027; --ink: #e6e9ed; --muted: #9aa4af; --line: #2e3740;
    --accent: #7fb0ec; --accent-soft: #1d2d42;
    --ok: #6fcf97; --ok-soft: #173326; --warn: #f0b45a; --warn-soft: #3a2c14;
    --err: #f08a80; --err-soft: #3d1c1a; --info: #7fb0ec; --info-soft: #1d2d42;
    --code-bg: #222a33;
  }
}
:root[data-theme="dark"] {
  --bg: #12161b; --panel: #1a2027; --ink: #e6e9ed; --muted: #9aa4af; --line: #2e3740;
  --accent: #7fb0ec; --accent-soft: #1d2d42;
  --ok: #6fcf97; --ok-soft: #173326; --warn: #f0b45a; --warn-soft: #3a2c14;
  --err: #f08a80; --err-soft: #3d1c1a; --info: #7fb0ec; --info-soft: #1d2d42;
  --code-bg: #222a33;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); }
main { max-width: 1180px; margin: 0 auto; padding: 32px 16px 56px; }
header.page { border-bottom: 2px solid var(--ink); padding-bottom: 14px; margin-bottom: 20px; position: relative; }
header.page h1 { font-size: 26px; line-height: 1.25; margin: 0 0 4px; letter-spacing: -0.01em; }
header.page .sub { color: var(--muted); margin: 0; }
header.page .meta { font: 12px/1.4 var(--mono); color: var(--muted); margin-top: 8px; }
#theme-toggle { position: absolute; top: 0; right: 0; font: 12px var(--mono); background: none; color: var(--muted);
  border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; cursor: pointer; }
.lead { font-size: 17px; border-left: 4px solid var(--accent); background: var(--panel); padding: 12px 16px; margin: 0 0 20px; }
.grid { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 16px; }
.grid.cols-1 { --cols: 1; } .grid.cols-2 { --cols: 2; } .grid.cols-3 { --cols: 3; } .grid.cols-4 { --cols: 4; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-width: 0; display: flex; flex-direction: column; }
.panel.span-2 { grid-column: span 2; } .panel.span-3 { grid-column: span 3; } .panel.span-all { grid-column: 1 / -1; }
.panel > h2 { display: flex; align-items: baseline; gap: 8px; font-size: 14px; margin: 0; padding: 9px 14px; border-bottom: 1px solid var(--line); }
.panel > h2 .id { font: 600 11px var(--mono); color: var(--panel); background: var(--ink); border-radius: 3px; padding: 1px 6px; }
.panel > h2 .note { margin-left: auto; font: 11px var(--mono); color: var(--muted); font-weight: 400; }
.panel > .body { padding: 12px 14px; flex: 1; overflow-x: auto; }
.body > :first-child { margin-top: 0; } .body > :last-child { margin-bottom: 0; }
p, ul, ol { margin: 0 0 10px; } ul, ol { padding-left: 20px; } li { margin: 2px 0; }
code { font: 0.9em var(--mono); background: var(--code-bg); padding: 1px 4px; border-radius: 3px; }
pre { font: 12.5px/1.5 var(--mono); background: var(--code-bg); padding: 10px 12px; border-radius: 4px; overflow-x: auto; margin: 0 0 10px; }
pre code { background: none; padding: 0; }
table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 0 0 10px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.b { display: inline-block; font: 600 11px/1.6 var(--mono); padding: 0 6px; border-radius: 3px; white-space: nowrap; }
.b.ok { color: var(--ok); background: var(--ok-soft); } .b.no { color: var(--err); background: var(--err-soft); }
.b.warn { color: var(--warn); background: var(--warn-soft); } .b.info { color: var(--info); background: var(--info-soft); }
.callout { border-left: 4px solid var(--c); background: var(--cs); padding: 10px 12px; border-radius: 0 4px 4px 0; margin: 0 0 10px; }
.callout > strong:first-child { display: block; color: var(--c); margin-bottom: 2px; }
.callout.info { --c: var(--info); --cs: var(--info-soft); } .callout.ok { --c: var(--ok); --cs: var(--ok-soft); }
.callout.warn { --c: var(--warn); --cs: var(--warn-soft); } .callout.err { --c: var(--err); --cs: var(--err-soft); }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 10px; }
.flow.v { flex-direction: column; align-items: stretch; }
.flow .node { border: 1.5px solid var(--ink); border-radius: 5px; padding: 6px 10px; background: var(--panel); font-size: 14px; text-align: center; }
.flow .node.hl { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.flow .node.dec { border-style: dashed; } .flow .node small { display: block; color: var(--muted); font-size: 12px; }
.flow .arrow { color: var(--muted); font: 12px var(--mono); text-align: center; }
.flow .arrow::before { content: "→"; display: block; font-size: 18px; line-height: 1; color: var(--ink); }
.flow.v .arrow::before { content: "↓"; }
.seq { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); row-gap: 2px; margin: 0 0 10px; font-size: 13px; }
.seq .actor { text-align: center; font-weight: 600; border: 1.5px solid var(--ink); border-radius: 5px; padding: 4px; margin: 0 6px 6px; }
.seq .msg { position: relative; text-align: center; padding: 2px 4px 10px; border-bottom: 1.5px solid var(--ink); margin: 0 12.5%; }
.seq .msg.r::after, .seq .msg.l::after { position: absolute; bottom: -9px; font-size: 14px; line-height: 1; }
.seq .msg.r::after { content: "▶"; right: -6px; } .seq .msg.l::after { content: "◀"; left: -6px; }
.seq .msg.dash { border-bottom-style: dashed; }
.seq .phase { grid-column: 1 / -1; text-align: center; font: 11px var(--mono); color: var(--muted); border-top: 1px dotted var(--line); padding-top: 2px; margin-top: 4px; }
.tree, .tree ul { list-style: none; padding-left: 0; margin: 0 0 10px; font-size: 14px; }
.tree ul { padding-left: 18px; margin: 0; border-left: 1px solid var(--line); }
.tree li { position: relative; padding-left: 12px; }
.tree ul > li::before { content: ""; position: absolute; left: -18px; top: 0.8em; width: 26px; border-top: 1px solid var(--line); }
.tree .d { color: var(--muted); font-size: 13px; }
.timeline { list-style: none; padding: 0; margin: 0 0 10px; border-left: 2px solid var(--line); }
.timeline li { position: relative; padding: 0 0 10px 16px; }
.timeline li::before { content: ""; position: absolute; left: -6px; top: 0.45em; width: 10px; height: 10px; border-radius: 50%; background: var(--panel); border: 2px solid var(--ink); }
.timeline li.hl::before { background: var(--accent); border-color: var(--accent); }
.timeline .t { font: 12px var(--mono); color: var(--muted); }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0 0 10px; font-size: 14px; }
dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; }
.meter { margin: 0 0 8px; font-size: 13px; }
.meter .bar { height: 8px; background: var(--code-bg); border-radius: 4px; overflow: hidden; margin-top: 3px; }
.meter .bar > i { display: block; height: 100%; background: var(--accent); }
.meter.over .bar > i { background: var(--err); }
svg.fig { max-width: 100%; height: auto; color: var(--ink); }
del, .bad { color: var(--err); }
footer.page { margin-top: 24px; font: 12px var(--mono); color: var(--muted); }
@media (max-width: 820px) {
  .grid { grid-template-columns: minmax(0, 1fr) !important; }
  .panel.span-2, .panel.span-3 { grid-column: auto; }
  header.page h1 { padding-right: 70px; }
}
@media print { #theme-toggle { display: none; } body { background: #fff; } }
</style>
</head>
<body>
<main>
{{BODY}}
<footer class="page">{{FOOTER}}</footer>
</main>
<script>
(function () {
  var b = document.getElementById("theme-toggle");
  if (!b) return;
  b.addEventListener("click", function () {
    var r = document.documentElement;
    var dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
  });
})();
</script>
</body>
</html>
